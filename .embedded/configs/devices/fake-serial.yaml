# ============================================
# 模拟串口设备（TCP 假设备，无需真实板卡）
#
# 用途：在没有硬件的情况下验证串口全链路（连接 / 登录 / exec /
# read / write / Ctrl+C / 日志落盘）。toolkit 以 TCP 客户端接入
# 本地假设备，会话判定与真实串口完全一致（baudRate 等参数忽略）。
#
# 启动假设备（另开终端，保持运行）：
#   npm run fake:serial                  # 已登录 shell，提示符 "~ # "
#   npm run fake:serial -- --login       # 带 getty 登录流程（root/root）
#   node test/scripts/serial/fake-device.mjs --port 4444
#
# 注：本文件端口与 board-virt.yaml（QEMU 虚拟板卡）同为 4444，二者是
# 替代关系，不要同时启动；要并行测试改这里的 port 并给假设备传 --port。
# 手工跑 node 脚本时需带 BOARD_CONFIG_PATH=./.embedded/configs/config.yaml，
# 否则读不到本文件（.mcp.json 启动 MCP 时该变量已配好）。
#
# 使用方式（三选一）：
#   1. 单次调用传设备名：serial_open({ device: "fake-serial" })
#   2. MCP 启动前设 DEVICE=fake-serial（.mcp.json 的 env 或启动脚本）
#   3. 把 config.yaml 的 default 改成 fake-serial
#
# 覆盖能力：
#   serial_open / serial_close      连接、banner、同端点防重
#   serial_shell_login              --login 模式走账号密码；默认模式判"无 PSH"
#   serial_exec                     marker 退出码、提示符兜底、echo 剥离
#   serial_read / serial_write      原始收发
#   serial_send_ctrl                Ctrl+C 中断 top 这类常驻命令
#   常驻命令采样超时                 执行 top（持续刷屏，10s 后自动 Ctrl+C）
# ============================================

# ADB 通道：不绑定设备（模拟设备没有 adb）
adb:
  serialNo: "sn_none"

# SSH 通道：显式关闭（需要 SSH 时改 host/port 指向本机 sshd 或容器）
ssh:
  host: "none"

serial:
  # TCP 端点：等价于 QEMU -serial tcp:127.0.0.1:4444,server,nowait
  port: "tcp://127.0.0.1:4444"
  baudRate: 115200 # TCP 端点下忽略，保留以便与真机配置形态一致
  # --login 模式下的登录凭据（默认 shell 模式用不到，但 serial_shell_login 会读）
  loginUsername: "root"
  loginPassword: "root"
  keyProvider:
    mode: "file"
    challengeFilePath: "./.embedded/configs/challenge.txt" # 相对 cwd
    keyFilePath: "./.embedded/configs/password_input.txt" # 相对 cwd
    pollInterval: 500
    timeout: 120000
