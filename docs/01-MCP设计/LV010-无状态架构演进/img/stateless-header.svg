<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:759px;height:370px;background:#FFFFFF;" width="759px" height="370px" viewBox="0 0 759 370" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7beta11?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="24"><text x="140.718" y="35.421" fill="#000" font-size="22" textLength="475.729" font-weight="700" font-family="'Segoe UI'">Header 路由:网关只看 header,不解析 body</text></g><!--cluster old--><g class="cluster" data-qualified-name="old" id="ent0001" data-source-line="27"><rect x="12" y="130.279" width="297" height="132.21" fill="#FFE8E8" style="stroke:#7A93BE;stroke-width:1;" rx="5" ry="5"/><text x="80.616" y="143.418" fill="#1F2933" font-size="12" textLength="159.769" font-weight="700" font-family="'Segoe UI'">有状态(旧):网关必须深度解析</text></g><!--cluster new--><g class="cluster" data-qualified-name="new" id="ent0006" data-source-line="39"><rect x="349" y="136.099" width="311" height="120.57" fill="#DDF3E4" style="stroke:#7A93BE;stroke-width:1;" rx="5" ry="5"/><text x="434.064" y="149.238" fill="#1F2933" font-size="12" textLength="140.872" font-weight="700" font-family="'Segoe UI'">无状态(新):只看 Header</text></g><!--entity g1--><g class="entity" data-qualified-name="old.g1" id="ent0002" data-source-line="28"><rect x="36.5" y="187.399" width="73.01" height="33.969" fill="#FFF" style="stroke:#7A93BE;stroke-width:1;" rx="5" ry="5"/><text x="46.5" y="208.538" fill="#1F2933" font-size="12" textLength="53.01" font-family="'Segoe UI'">Gateway</text></g><g class="entity" data-qualified-name="old.GMN3" id="ent0004" data-source-line="30"><path d="M144.39,175.279 L144.39,200.389 L109.87,204.389 L144.39,208.389 L144.39,233.483 A5,5 0 0 0 149.39,238.483 L260.61,238.483 A5,5 0 0 0 265.61,233.483 L265.61,180.279 L255.61,170.279 L149.39,170.279 A5,5 0 0 0 144.39,175.279" style="stroke:#E0B400;stroke-width:1;" fill="#FFFBE6"/><path d="M255.61,170.279 L255.61,177.779 A2.5,2.5 0 0 0 258.11,180.279 L265.61,180.279 L255.61,170.279" style="stroke:#E0B400;stroke-width:1;" fill="#FFFBE6"/><text x="150.39" y="184.562" fill="#5C4A00" font-size="10" textLength="99.575" font-family="'Segoe UI'">1. 读完整 HTTP body</text><text x="150.39" y="196.202" fill="#5C4A00" font-size="10" textLength="60.547" font-family="'Segoe UI'">2. JSON 解析</text><text x="150.39" y="207.843" fill="#5C4A00" font-size="10" textLength="87.041" font-family="'Segoe UI'">3. 提取 session_id</text><text x="150.39" y="219.483" fill="#5C4A00" font-size="10" textLength="100.22" font-family="'Segoe UI'">4. 按 session_id 路由</text><text x="150.39" y="231.124" fill="#5C4A00" font-size="10" textLength="93.179" font-family="'Segoe UI'">—— 慢、重、易出错</text></g><!--entity g2--><g class="entity" data-qualified-name="new.g2" id="ent0007" data-source-line="40"><rect x="373.5" y="187.399" width="73.01" height="33.969" fill="#FFF" style="stroke:#7A93BE;stroke-width:1;" rx="5" ry="5"/><text x="383.5" y="208.538" fill="#1F2933" font-size="12" textLength="53.01" font-family="'Segoe UI'">Gateway</text></g><g class="entity" data-qualified-name="new.GMN8" id="ent0009" data-source-line="42"><path d="M481.12,181.099 L481.12,200.389 L446.92,204.389 L481.12,208.389 L481.12,227.662 A5,5 0 0 0 486.12,232.662 L611.886,232.662 A5,5 0 0 0 616.886,227.662 L616.886,186.099 L606.886,176.099 L486.12,176.099 A5,5 0 0 0 481.12,181.099" style="stroke:#E0B400;stroke-width:1;" fill="#FFFBE6"/><path d="M606.886,176.099 L606.886,183.599 A2.5,2.5 0 0 0 609.386,186.099 L616.886,186.099 L606.886,176.099" style="stroke:#E0B400;stroke-width:1;" fill="#FFFBE6"/><text x="487.12" y="190.382" fill="#5C4A00" font-size="10" textLength="112.832" font-family="'Segoe UI'">Mcp-Method: tools/call</text><text x="487.12" y="202.022" fill="#5C4A00" font-size="10" textLength="93.569" font-family="'Segoe UI'">Mcp-Name: search</text><text x="487.12" y="213.663" fill="#5C4A00" font-size="10" textLength="114.766" font-family="'Segoe UI'">—— 直接用 header 路由</text><text x="487.12" y="225.303" fill="#5C4A00" font-size="10" textLength="87.91" font-family="'Segoe UI'">body 原封不动转发</text></g><g class="entity" data-qualified-name="GMN12" id="ent0013" data-source-line="52"><path d="M559.83,303.489 L559.83,350.052 A5,5 0 0 0 564.83,355.052 L739.165,355.052 A5,5 0 0 0 744.165,350.052 L744.165,308.489 L734.165,298.489 L564.83,298.489 A5,5 0 0 0 559.83,303.489" style="stroke:#E0B400;stroke-width:1;" fill="#FFFBE6"/><path d="M734.165,298.489 L734.165,305.989 A2.5,2.5 0 0 0 736.665,308.489 L744.165,308.489 L734.165,298.489" style="stroke:#E0B400;stroke-width:1;" fill="#FFFBE6"/><text x="565.83" y="312.772" fill="#5C4A00" font-size="10" textLength="20" font-weight="700" font-family="'Segoe UI'">收益</text><text x="565.83" y="324.412" fill="#5C4A00" font-size="10" textLength="158.721" font-family="'Segoe UI'">- WAF / 限流器 / 鉴权层零成本接入</text><text x="565.83" y="336.053" fill="#5C4A00" font-size="10" textLength="127.793" font-family="'Segoe UI'">- 无需定制 JSON 解析中间件</text><text x="565.83" y="347.693" fill="#5C4A00" font-size="10" textLength="163.335" font-family="'Segoe UI'">- 网关性能:微秒级路由,无需反序列化</text></g><!--link old to new--><!--link new to GMN12--><g class="link" data-entity-1="ent0006" data-entity-2="ent0013" id="lnk14" data-source-line="52" data-link-type="association"><path d="M652,256.929 C652,257.243 652,257.557 652,257.871 C652,259.127 652,260.388 652,261.652 C652,264.178 652,266.714 652,269.241 C652,279.351 652,289.322 652,298.009" style="stroke:#5A5A5A;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="new-GMN12"/></g><?plantuml-src ZLDhJzDG6FxUN_4A7vI5opQ6m4II0Qje0fg0yOCnfbiFQqFf8Mq9GMEoIGWN6HiwcSYy1qSCSebpc17qloZdTFiNdhRRB236isNfdkUzFEzptbum93I1O58HP9NJnsLrKj242OW8qV6OXgTKiHyhM8D6tZwk25qIH3pjF8y9YexES6VWQZrDHHhul2v2H6F2b6BmM3M61QQcOGJ5C8BRrnjSGI5DmzDLDHqXwtEQjFAh0Uts-Ll0YFm0WS_dbeMYXg3650GFEO2-CvDtyjrylyLWJKHQ5UqCTRVtXUleg2H7nrMaw-1Z