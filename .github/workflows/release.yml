name: Publish Release

# 触发条件：推送到 main/master 且 commit message 含 [release] 标记
# 触发链：CNB push(main) → tencentcom/git-sync 同步到 GitHub → 本流水线触发
on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write # 创建 tag / release 需要

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. 读取版本号并创建草稿 Release（占位，后续 job 上传产物）
  # ─────────────────────────────────────────────────────────────
  release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    if: contains(join(github.event.commits.*.message, ' '), '[release]')
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read version from package.json
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          draft: true
          prerelease: false
          generate_release_notes: true
          body: |
            ## 产物说明

            | 文件 | 适用场景 |
            |------|---------|
            | `embedded-mcp-toolkit-${{ steps.meta.outputs.version }}-offline.tar.gz` | 离线包（含预编译 out/ + 生产 node_modules），**无网**环境 |
            | `embedded-mcp-toolkit-${{ steps.meta.outputs.version }}-binary.tar.tgz` | Windows 免 Node 单文件 exe（含串口原生绑定） |

            ### 离线环境（offline 包）

            下载 `embedded-mcp-toolkit-${{ steps.meta.outputs.version }}-offline.tar.gz`，传到目标服务器后：

            ```bash
            tar -xzf embedded-mcp-toolkit-${{ steps.meta.outputs.version }}-offline.tar.gz
            cd embedded-mcp-toolkit-${{ steps.meta.outputs.version }}-offline
            node bin/embedded-mcp-toolkit-cli.js
            ```

            > 离线包已预编译 `out/`，并内置生产 `node_modules`（serialport 的 prebuilds 已覆盖 linux/darwin/win32/arm 全平台 `.node`），无需 `npm install`，开箱即用。

            ### Windows exe（binary 包）

            下载 `embedded-mcp-toolkit-${{ steps.meta.outputs.version }}-binary.tar.tgz`，在 Windows 上解压后得到 `embedded-mcp-toolkit-${{ steps.meta.outputs.version }}-binary/` 目录：

            ```bash
            tar -xzf embedded-mcp-toolkit-${{ steps.meta.outputs.version }}-binary.tar.tgz
            cd embedded-mcp-toolkit-${{ steps.meta.outputs.version }}-binary
            ./embedded-mcp-toolkit.exe init
            ```

            > exe 与 `prebuilds/` 目录必须一起拷贝使用（串口功能依赖 win32-x64 原生绑定）；无需安装 Node.js，仅 Windows x64 支持串口。

  # ─────────────────────────────────────────────────────────────
  # 2. 构建：基于 npm 发布内容 + 精简 node_modules 打出全平台离线包
  #    serialport 的 @serialport/bindings-cpp/prebuilds 已内置全平台二进制（与 runner 平台无关）。
  #    使用 windows runner 打包：离线包主要在 Windows 使用，且 Windows 上 npm 生成的
  #    node_modules/.bin 是普通文件（.cmd/.ps1）而非符号链接，解压时不会触发 WinRAR
  #    "不能创建符号链接 / 客户端没有所需的特权" 错误。
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build offline bundle
    needs: release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash # Windows runner 默认 PowerShell，统一改用 Git Bash 跑 tar/npm pack
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install dependencies (含 dev，用于编译)
        run: npm ci

      - name: Build TypeScript → out/
        run: npm run build

      - name: Prune devDependencies（精简离线包 node_modules）
        # 等价于 npm i @smai-kit/embedded-mcp-toolkit 时自动安装的依赖范围
        run: npm prune --omit=dev

      - name: Verify platform binaries
        run: |
          echo "== @serialport/bindings-cpp prebuilds =="
          ls node_modules/@serialport/bindings-cpp/prebuilds/ || true

      # 离线包 = npm 发布内容（npm pack，遵循 .npmignore）+ 生产 node_modules
      # 用 npm pack 复刻发布清单，保证与 npm 包零漂移
      - name: Pack offline bundle
        id: pack
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          PKG_DIR="embedded-mcp-toolkit-${VERSION}-offline"
          ARCHIVE="${PKG_DIR}.tar.gz"

          # 1. npm pack 生成 npm 发布内容（.tgz，内含 package/ 前缀）
          npm pack

          # 2. 解包到 PKG_DIR，去掉 package/ 前缀
          TGZ="$(ls *.tgz | head -1)"
          mkdir -p "$PKG_DIR"
          tar -xzf "$TGZ" --strip-components=1 -C "$PKG_DIR"

          # 3. 补入生产 node_modules（已在上方 npm prune 精简）
          cp -a node_modules "$PKG_DIR/"

          # 4. 打包最终离线包
          tar -czf "$ARCHIVE" "$PKG_DIR"
          ls -lh "$ARCHIVE"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload offline bundle
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          draft: true
          files: ${{ steps.pack.outputs.archive }}

  # ─────────────────────────────────────────────────────────────
  # 3. 构建 Windows 免 Node 单文件 exe 并打包发布（binary 包）
  #    exe 由 Bun --compile 产出（scripts/build-exe.mjs），串口原生绑定走
  #    @dimava 分支 win32-x64 预编译；仅 Windows x64 支持串口，故用 windows runner。
  #    包内顶层目录名 = 包名去掉 .tar.tgz 后缀（embedded-mcp-toolkit-<版本>-binary/）。
  # ─────────────────────────────────────────────────────────────
  build-exe:
    name: Build Windows exe bundle
    needs: release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash # Windows runner 默认 PowerShell，统一改用 Git Bash 跑 cp/tar
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies (含 dev，打包 exe 需要)
        run: npm ci

      - name: Build exe (scripts/build-exe.mjs)
        run: npm run pack:exe:win

      - name: Verify exe-out
        run: |
          ls -lh exe-out/
          find exe-out -type f

      - name: Pack binary bundle
        id: pack
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          PKG_DIR="embedded-mcp-toolkit-${VERSION}-binary"
          ARCHIVE="${PKG_DIR}.tar.tgz"

          # exe 与 prebuilds/ 一起打包；解压后目录名 = 包名去 .tar.tgz 后缀
          mkdir -p "$PKG_DIR"
          cp -a exe-out/embedded-mcp-toolkit.exe "$PKG_DIR/"
          cp -a exe-out/prebuilds "$PKG_DIR/"
          tar -czf "$ARCHIVE" "$PKG_DIR"
          ls -lh "$ARCHIVE"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload binary bundle
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          draft: true
          files: ${{ steps.pack.outputs.archive }}

  # ─────────────────────────────────────────────────────────────
  # 4. 全部产物上传完毕，把草稿 Release 正式发布
  # ─────────────────────────────────────────────────────────────
  publish:
    name: Publish Release
    needs: [release, build, build-exe]
    runs-on: ubuntu-latest
    steps:
      - name: Mark release as published (undraft)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          draft: false
          make_latest: true
